<div class="page-container">
  <div class="page-header">
    <h1>Notes de frais</h1>
  </div>
  <div *ngIf="loading" class="loading-wrapper"><mat-spinner diameter="40"></mat-spinner></div>
  <ng-container *ngIf="!loading">
    <mat-card *ngIf="!expenses.length" class="empty-card">
      <mat-card-content><p class="no-data">Aucune note de frais trouvée</p></mat-card-content>
    </mat-card>
    <mat-card *ngIf="expenses.length">
      <mat-card-content>
        <table mat-table [dataSource]="expenses" class="full-width">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Titre</th>
            <td mat-cell *matCellDef="let e">{{e.title}}</td>
          </ng-container>
          <ng-container matColumnDef="totalAmount">
            <th mat-header-cell *matHeaderCellDef>Montant</th>
            <td mat-cell *matCellDef="let e">{{formatCurrency(e.totalAmount)}}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let e">
              <span class="status-chip" [class]="e.status?.toLowerCase()">{{e.status | status}}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="submittedAt">
            <th mat-header-cell *matHeaderCellDef>Soumis le</th>
            <td mat-cell *matCellDef="let e">{{e.submittedAt ? (e.submittedAt | date:'dd/MM/yyyy') : '-'}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let e">
              <button mat-stroked-button color="primary" *ngIf="e.status === 'BROUILLON'" (click)="submit(e.id)">
                Soumettre
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
