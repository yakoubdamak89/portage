<div class="page-container">
  <div class="page-header">
    <h1>Bulletins de paie</h1>
  </div>
  <div *ngIf="loading" class="loading-wrapper"><mat-spinner diameter="40"></mat-spinner></div>
  <ng-container *ngIf="!loading">
    <mat-card *ngIf="!payslips.length" class="empty-card">
      <mat-card-content><p class="no-data">Aucun bulletin de paie disponible</p></mat-card-content>
    </mat-card>
    <mat-card *ngIf="payslips.length">
      <mat-card-content>
        <table mat-table [dataSource]="payslips" class="full-width">
          <ng-container matColumnDef="period">
            <th mat-header-cell *matHeaderCellDef>Période</th>
            <td mat-cell *matCellDef="let p">{{monthLabel(p.month, p.year)}}</td>
          </ng-container>
          <ng-container matColumnDef="grossSalary">
            <th mat-header-cell *matHeaderCellDef>Salaire brut</th>
            <td mat-cell *matCellDef="let p">{{formatCurrency(p.grossSalary)}}</td>
          </ng-container>
          <ng-container matColumnDef="netSalary">
            <th mat-header-cell *matHeaderCellDef>Salaire net</th>
            <td mat-cell *matCellDef="let p">{{formatCurrency(p.netSalary)}}</td>
          </ng-container>
          <ng-container matColumnDef="generatedAt">
            <th mat-header-cell *matHeaderCellDef>Généré le</th>
            <td mat-cell *matCellDef="let p">{{p.generatedAt | date:'dd/MM/yyyy'}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let p">
              <button mat-icon-button color="primary" matTooltip="Télécharger" (click)="download(p.id)">
                <mat-icon>download</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
