<div class="page-container">
  <div class="page-header">
    <h1>Comptes rendus d'activité</h1>
  </div>
  <div *ngIf="loading" class="loading-wrapper"><mat-spinner diameter="40"></mat-spinner></div>
  <ng-container *ngIf="!loading">
    <mat-card *ngIf="!timesheets.length" class="empty-card">
      <mat-card-content><p class="no-data">Aucun CRA trouvé</p></mat-card-content>
    </mat-card>
    <mat-card *ngIf="timesheets.length">
      <mat-card-content>
        <table mat-table [dataSource]="timesheets" class="full-width">
          <ng-container matColumnDef="period">
            <th mat-header-cell *matHeaderCellDef>Période</th>
            <td mat-cell *matCellDef="let t">{{monthLabel(t.month)}} {{t.year}}</td>
          </ng-container>
          <ng-container matColumnDef="mission">
            <th mat-header-cell *matHeaderCellDef>Mission</th>
            <td mat-cell *matCellDef="let t">{{t.missionTitle || '-'}}</td>
          </ng-container>
          <ng-container matColumnDef="days">
            <th mat-header-cell *matHeaderCellDef>Jours</th>
            <td mat-cell *matCellDef="let t">{{t.totalDays}}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let t">
              <span class="status-chip" [class]="t.status?.toLowerCase()">{{t.status | status}}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let t">
              <button mat-stroked-button color="primary" *ngIf="t.status === 'BROUILLON'" (click)="submit(t.id)">
                Soumettre
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
