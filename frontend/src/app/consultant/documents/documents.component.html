<div class="page-container">
  <div class="page-header">
    <h1>Documents</h1>
  </div>
  <div *ngIf="loading" class="loading-wrapper"><mat-spinner diameter="40"></mat-spinner></div>
  <ng-container *ngIf="!loading">
    <mat-card *ngIf="!documents.length" class="empty-card">
      <mat-card-content><p class="no-data">Aucun document disponible</p></mat-card-content>
    </mat-card>
    <mat-card *ngIf="documents.length">
      <mat-card-content>
        <table mat-table [dataSource]="documents" class="full-width">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let d">{{d.name}}</td>
          </ng-container>
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let d">{{d.type}}</td>
          </ng-container>
          <ng-container matColumnDef="uploadedAt">
            <th mat-header-cell *matHeaderCellDef>Ajouté le</th>
            <td mat-cell *matCellDef="let d">{{d.uploadedAt | date:'dd/MM/yyyy'}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let d">
              <a mat-icon-button color="primary" matTooltip="Télécharger" [href]="d.url" target="_blank" *ngIf="d.url">
                <mat-icon>download</mat-icon>
              </a>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
