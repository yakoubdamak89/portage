<div class="page-container">
  <div class="page-header">
    <h1>Consultants</h1>
    <button mat-raised-button color="primary"><mat-icon>add</mat-icon> Nouveau consultant</button>
  </div>
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" style="width:300px;margin-bottom:16px">
        <mat-label>Rechercher</mat-label>
        <input matInput [formControl]="searchControl" placeholder="Nom, email...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <div *ngIf="loading" style="text-align:center;padding:40px"><mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner></div>
      <table mat-table [dataSource]="dataSource" matSort class="full-width" *ngIf="!loading">
        <ng-container matColumnDef="firstName"><th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th><td mat-cell *matCellDef="let r">{{r.firstName}} {{r.lastName}}</td></ng-container>
        <ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let r">{{r.email}}</td></ng-container>
        <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let r"><span class="status-chip" [class]="r.status?.toLowerCase()">{{r.status | status}}</span></td></ng-container>
        <ng-container matColumnDef="dailyRate"><th mat-header-cell *matHeaderCellDef mat-sort-header>TJM</th><td mat-cell *matCellDef="let r">{{r.dailyRate | currency:'EUR':'symbol':'1.0-0':'fr'}}</td></ng-container>
        <ng-container matColumnDef="managerName"><th mat-header-cell *matHeaderCellDef>Gestionnaire</th><td mat-cell *matCellDef="let r">{{r.managerName || '-'}}</td></ng-container>
        <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let r">
          <button mat-icon-button color="primary" (click)="viewDetail(r.id)" matTooltip="Voir détail"><mat-icon>visibility</mat-icon></button>
        </td></ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="clickable-row" (click)="viewDetail(row.id)"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
