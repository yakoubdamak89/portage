<div class="page-container">
  <div class="page-header"><h1>Clients</h1><button mat-raised-button color="primary"><mat-icon>add</mat-icon> Nouveau client</button></div>
  <mat-card><mat-card-content>
    <mat-form-field appearance="outline" style="width:300px;margin-bottom:16px">
      <mat-label>Rechercher</mat-label><input matInput [formControl]="searchControl"><mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <div *ngIf="loading" style="text-align:center;padding:40px"><mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner></div>
    <table mat-table [dataSource]="dataSource" matSort class="full-width" *ngIf="!loading">
      <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th><td mat-cell *matCellDef="let r">{{r.name}}</td></ng-container>
      <ng-container matColumnDef="siret"><th mat-header-cell *matHeaderCellDef>SIRET</th><td mat-cell *matCellDef="let r">{{r.siret || '-'}}</td></ng-container>
      <ng-container matColumnDef="contactName"><th mat-header-cell *matHeaderCellDef>Contact</th><td mat-cell *matCellDef="let r">{{r.contactName || '-'}}</td></ng-container>
      <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let r"><span class="status-chip" [class]="r.status?.toLowerCase()">{{r.status | status}}</span></td></ng-container>
      <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let r"><button mat-icon-button color="primary" (click)="viewDetail(r.id)"><mat-icon>visibility</mat-icon></button></td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewDetail(row.id)" class="clickable-row"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
  </mat-card-content></mat-card>
</div>
