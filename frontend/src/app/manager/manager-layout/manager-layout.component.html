<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" [opened]="sidenavOpen" class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="brand-icon">business_center</mat-icon>
      <span class="brand-name">Portage Pro</span>
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      <button mat-icon-button (click)="sidenavOpen = !sidenavOpen"><mat-icon>menu</mat-icon></button>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button><mat-icon>notifications</mat-icon></button>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        <span *ngIf="currentUser">{{currentUser.firstName}} {{currentUser.lastName}}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Déconnexion</button>
      </mat-menu>
    </mat-toolbar>
    <div class="content-area"><router-outlet></router-outlet></div>
  </mat-sidenav-content>
</mat-sidenav-container>
