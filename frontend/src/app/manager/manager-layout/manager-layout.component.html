<mat-sidenav-container class="sidenav-container" [class.glass-mode]="isGlassMode">
  <mat-sidenav #sidenav mode="side" [opened]="sidenavOpen" class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="brand-icon">business_center</mat-icon>
      <span class="brand-name">Portage Pro</span>
    </div>
    <span class="nav-section-label">Navigation</span>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span matListItemTitle>{{item.label}}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      <button mat-icon-button (click)="sidenavOpen = !sidenavOpen" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      <div class="toolbar-actions">
        <div class="glass-toggle-wrap" [class.active]="isGlassMode">
          <mat-icon class="toggle-icon">auto_awesome</mat-icon>
          <mat-slide-toggle [checked]="isGlassMode" (change)="themeService.toggleGlassMode()" color="primary" class="glass-toggle">
            <span class="toggle-label">Mode Glass</span>
          </mat-slide-toggle>
        </div>
        <button mat-icon-button aria-label="Notifications"><mat-icon>notifications_none</mat-icon></button>
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
          <mat-icon>account_circle</mat-icon>
          <span *ngIf="currentUser">{{currentUser.firstName}} {{currentUser.lastName}}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Déconnexion</button>
        </mat-menu>
      </div>
    </mat-toolbar>
    <div class="content-area"><router-outlet></router-outlet></div>
  </mat-sidenav-content>
</mat-sidenav-container>
