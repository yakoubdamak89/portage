<div class="page-container">
  <div class="page-header">
    <h1>Comptes rendus d'activité</h1>
  </div>
  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
      <table mat-table [dataSource]="timesheets" *ngIf="!loading">
        <ng-container matColumnDef="consultant"><th mat-header-cell *matHeaderCellDef>Consultant</th><td mat-cell *matCellDef="let r">{{r.consultantName}}</td></ng-container>
        <ng-container matColumnDef="mission"><th mat-header-cell *matHeaderCellDef>Mission</th><td mat-cell *matCellDef="let r">{{r.missionTitle}}</td></ng-container>
        <ng-container matColumnDef="period"><th mat-header-cell *matHeaderCellDef>Période</th><td mat-cell *matCellDef="let r">{{r.month}}/{{r.year}}</td></ng-container>
        <ng-container matColumnDef="days"><th mat-header-cell *matHeaderCellDef>Jours</th><td mat-cell *matCellDef="let r">{{r.totalDays}}</td></ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let r"><span class="status-chip" [ngClass]="r.status | lowercase">{{r.status | status}}</span></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="primary" (click)="validate(r.id)" *ngIf="r.status==='SUBMITTED'" matTooltip="Valider"><mat-icon>check</mat-icon></button>
            <button mat-icon-button color="warn" (click)="reject(r.id)" *ngIf="r.status==='SUBMITTED'" matTooltip="Rejeter"><mat-icon>close</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
