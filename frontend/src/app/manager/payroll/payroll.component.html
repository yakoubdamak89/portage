<div class="page-container">
  <div class="page-header"><h1>Gestion de la paie</h1></div>
  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
      <table mat-table [dataSource]="dataSource" *ngIf="!loading">
        <ng-container matColumnDef="consultant"><th mat-header-cell *matHeaderCellDef>Consultant</th><td mat-cell *matCellDef="let r">{{r.consultantName}}</td></ng-container>
        <ng-container matColumnDef="period"><th mat-header-cell *matHeaderCellDef>Période</th><td mat-cell *matCellDef="let r">{{r.month}}/{{r.year}}</td></ng-container>
        <ng-container matColumnDef="grossSalary"><th mat-header-cell *matHeaderCellDef>Brut</th><td mat-cell *matCellDef="let r">{{r.grossSalary | number:'1.2-2'}} €</td></ng-container>
        <ng-container matColumnDef="netSalary"><th mat-header-cell *matHeaderCellDef>Net</th><td mat-cell *matCellDef="let r">{{r.netSalary | number:'1.2-2'}} €</td></ng-container>
        <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let r"><span class="status-chip validated">Généré</span></td></ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="primary" (click)="download(r.id)" matTooltip="Télécharger"><mat-icon>download</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      </table>
      <div *ngIf="!loading && dataSource.data.length===0" class="empty-state">
        <mat-icon>description</mat-icon>
        <p>Aucune fiche de paie générée</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
