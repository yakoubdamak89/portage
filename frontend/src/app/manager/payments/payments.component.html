<div class="page-container">
  <div class="page-header"><h1>Paiements reçus</h1></div>
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width mb-16">
        <mat-label>Rechercher</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Client, référence...">
      </mat-form-field>
      <div *ngIf="loading" class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
      <table mat-table [dataSource]="dataSource" *ngIf="!loading">
        <ng-container matColumnDef="invoiceNumber"><th mat-header-cell *matHeaderCellDef>Facture</th><td mat-cell *matCellDef="let r">{{r.invoiceNumber}}</td></ng-container>
        <ng-container matColumnDef="client"><th mat-header-cell *matHeaderCellDef>Client</th><td mat-cell *matCellDef="let r">{{r.clientName}}</td></ng-container>
        <ng-container matColumnDef="amount"><th mat-header-cell *matHeaderCellDef>Montant</th><td mat-cell *matCellDef="let r">{{r.amount | number:'1.2-2'}} €</td></ng-container>
        <ng-container matColumnDef="paymentDate"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let r">{{r.paymentDate | date:'dd/MM/yyyy'}}</td></ng-container>
        <ng-container matColumnDef="reference"><th mat-header-cell *matHeaderCellDef>Référence</th><td mat-cell *matCellDef="let r">{{r.reference}}</td></ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
