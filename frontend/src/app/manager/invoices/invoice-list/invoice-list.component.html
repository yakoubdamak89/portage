<div class="page-container">
  <div class="page-header">
    <h1>Factures</h1>
  </div>
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width mb-16">
        <mat-label>Rechercher</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="N° facture, client...">
      </mat-form-field>
      <div *ngIf="loading" class="loading-center"><mat-spinner diameter="40"></mat-spinner></div>
      <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading">
        <ng-container matColumnDef="invoiceNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>N° Facture</th>
          <td mat-cell *matCellDef="let row">{{row.invoiceNumber}}</td>
        </ng-container>
        <ng-container matColumnDef="consultant">
          <th mat-header-cell *matHeaderCellDef>Consultant</th>
          <td mat-cell *matCellDef="let row">{{row.consultantName}}</td>
        </ng-container>
        <ng-container matColumnDef="client">
          <th mat-header-cell *matHeaderCellDef>Client</th>
          <td mat-cell *matCellDef="let row">{{row.clientName}}</td>
        </ng-container>
        <ng-container matColumnDef="totalHT">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Montant HT</th>
          <td mat-cell *matCellDef="let row">{{row.totalHT | number:'1.2-2'}} €</td>
        </ng-container>
        <ng-container matColumnDef="totalTTC">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Total TTC</th>
          <td mat-cell *matCellDef="let row">{{row.totalTTC | number:'1.2-2'}} €</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let row"><span class="status-chip" [ngClass]="row.status | lowercase">{{row.status | status}}</span></td>
        </ng-container>
        <ng-container matColumnDef="dueDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Échéance</th>
          <td mat-cell *matCellDef="let row">{{row.dueDate | date:'dd/MM/yyyy'}}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="viewDetail(row.id)" matTooltip="Voir"><mat-icon>visibility</mat-icon></button>
            <button mat-icon-button color="accent" (click)="send(row.id)" *ngIf="row.status==='DRAFT'" matTooltip="Envoyer"><mat-icon>send</mat-icon></button>
            <button mat-icon-button color="primary" (click)="markPaid(row.id)" *ngIf="row.status==='SENT'||row.status==='OVERDUE'" matTooltip="Marquer payée"><mat-icon>check_circle</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
