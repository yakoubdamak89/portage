<div class="page-container">
  <div class="page-header">
    <h1>Missions</h1>
    <button mat-raised-button color="primary"><mat-icon>add</mat-icon> Nouvelle mission</button>
  </div>
  <mat-card>
    <mat-card-content>
      <mat-progress-spinner *ngIf="loading" mode="indeterminate"></mat-progress-spinner>
      <table mat-table [dataSource]="missions" *ngIf="!loading">
        <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Titre</th><td mat-cell *matCellDef="let m">{{m.title}}</td></ng-container>
        <ng-container matColumnDef="consultant"><th mat-header-cell *matHeaderCellDef>Consultant</th><td mat-cell *matCellDef="let m">{{m.consultantName}}</td></ng-container>
        <ng-container matColumnDef="client"><th mat-header-cell *matHeaderCellDef>Client</th><td mat-cell *matCellDef="let m">{{m.clientName}}</td></ng-container>
        <ng-container matColumnDef="startDate"><th mat-header-cell *matHeaderCellDef>Début</th><td mat-cell *matCellDef="let m">{{m.startDate | date}}</td></ng-container>
        <ng-container matColumnDef="endDate"><th mat-header-cell *matHeaderCellDef>Fin</th><td mat-cell *matCellDef="let m">{{m.endDate | date}}</td></ng-container>
        <ng-container matColumnDef="dailyRate"><th mat-header-cell *matHeaderCellDef>TJM</th><td mat-cell *matCellDef="let m">{{m.dailyRate | currency:'EUR'}}</td></ng-container>
        <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let m"><mat-chip>{{m.status | status}}</mat-chip></td></ng-container>
        <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let m"><a mat-icon-button [routerLink]="['/manager/missions', m.id]"><mat-icon>edit</mat-icon></a></td></ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
