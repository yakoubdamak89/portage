<div class="login-container">
  <mat-card class="login-card mat-elevation-z4">
    <div class="login-logo">
      <mat-icon class="logo-icon">business_center</mat-icon>
      <h1>Portage Pro</h1>
      <p class="subtitle">Gestion du portage salarial</p>
    </div>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width mb-16">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="votre@email.com" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email requis</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email invalide</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width mb-16">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Mot de passe requis</mat-error>
        </mat-form-field>
        <div class="remember-row mb-16">
          <mat-checkbox formControlName="rememberMe" color="primary">Se souvenir de moi</mat-checkbox>
        </div>
        <div class="error-msg mb-16" *ngIf="error">
          <mat-icon>error_outline</mat-icon>
          <span>{{error}}</span>
        </div>
        <button mat-raised-button color="primary" class="full-width login-btn" type="submit" [disabled]="loading">
          <mat-progress-spinner *ngIf="loading" diameter="20" mode="indeterminate"></mat-progress-spinner>
          <span *ngIf="!loading">Se connecter</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
