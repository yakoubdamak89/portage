name: CI/CD – Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically after every merge on the main branch.
# Can also be triggered manually from the Actions tab (workflow_dispatch).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deployment; queue instead.

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 – CI: verify the project compiles and passes basic checks
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend (Maven / Java 17) ──────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build backend (skip tests – Docker build runs them in image)
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      # ── Frontend (Node 20 / Angular) ───────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build -- --configuration production

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 – CD: deploy to VPS via SSH (runs only after CI passes)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    environment: production   # Optional: add a GitHub Environment for extra protection rules.
    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.VPS_HOST }}
          port:        ${{ secrets.VPS_PORT }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          # Pass the deploy script inline so no extra file needs to be present on the runner.
          script_stop: true   # Abort the SSH session on the first failing command.
          script: |
            set -euo pipefail
            # Bootstrap: clone the repository on first deploy if it doesn't exist yet.
            if [ ! -d "${HOME}/portage/.git" ]; then
              GIT_TERMINAL_PROMPT=0 git clone https://github.com/IngeniousDevelopersINDEV/portage.git "${HOME}/portage"
            fi
            bash ~/portage/scripts/deploy.sh
