name: CI/CD – Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically after every merge on the main branch.
# Can also be triggered manually from the Actions tab (workflow_dispatch).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deployment; queue instead.

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 – CI: verify the project compiles and passes basic checks
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend (Maven / Java 17) ──────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build backend (skip tests – Docker build runs them in image)
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      # ── Frontend (Node 20 / Angular) ───────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build -- --configuration production

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 – CD: deploy to VPS via SSH (runs only after CI passes)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    environment: production   # Optional: add a GitHub Environment for extra protection rules.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy source files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          port:     ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          # Copy only the files needed for deployment; excludes .git, .github, etc.
          # scripts/ includes deploy.sh, portage.service, and setup-systemd.sh
          source:   "backend,frontend,scripts,docker-compose.yml,.env.example"
          target:   "${{ secrets.VPS_DEPLOY_PATH }}"   # e.g. /home/user/portage
          rm:       false   # preserve server-side files not tracked in git (e.g. .env, uploads)

      - name: Write .env file on VPS (from GitHub Secrets)
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_DB:        ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:      ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:  ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET:         ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION:     ${{ secrets.JWT_EXPIRATION }}
          MAIL_HOST:          ${{ secrets.MAIL_HOST }}
          MAIL_PORT:          ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME:      ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD:      ${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP_AUTH:     ${{ secrets.MAIL_SMTP_AUTH }}
          MAIL_SMTP_STARTTLS: ${{ secrets.MAIL_SMTP_STARTTLS }}
          FRONTEND_PORT:      ${{ secrets.FRONTEND_PORT }}
        with:
          host:        ${{ secrets.VPS_HOST }}
          port:        ${{ secrets.VPS_PORT }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: POSTGRES_PASSWORD,JWT_SECRET,JWT_EXPIRATION,POSTGRES_DB,POSTGRES_USER,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_SMTP_AUTH,MAIL_SMTP_STARTTLS,FRONTEND_PORT
          script: |
            ENV_FILE="${{ secrets.VPS_DEPLOY_PATH }}/.env"
            # Only (re)write if at least the required secrets are present.
            if [ -n "${POSTGRES_PASSWORD}" ] && [ -n "${JWT_SECRET}" ]; then
              cat > "${ENV_FILE}" <<EOF
            POSTGRES_DB=${POSTGRES_DB:-portagedb}
            POSTGRES_USER=${POSTGRES_USER:-portage}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
            MAIL_HOST=${MAIL_HOST:-localhost}
            MAIL_PORT=${MAIL_PORT:-1025}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-false}
            MAIL_SMTP_STARTTLS=${MAIL_SMTP_STARTTLS:-false}
            FRONTEND_PORT=${FRONTEND_PORT:-80}
            EOF
              chmod 600 "${ENV_FILE}"
              echo ".env written to ${ENV_FILE}"
            else
              echo "WARNING: POSTGRES_PASSWORD and/or JWT_SECRET secrets are not set – keeping existing .env (if any)."
            fi

      - name: Install systemd service (if not already installed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.VPS_HOST }}
          port:        ${{ secrets.VPS_PORT }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            if ! systemctl is-enabled portage.service &>/dev/null; then
              echo "Installing Portage systemd service …"
              sudo bash "${{ secrets.VPS_DEPLOY_PATH }}/scripts/setup-systemd.sh" "${{ secrets.VPS_DEPLOY_PATH }}"
            else
              echo "Portage systemd service is already installed."
            fi

      - name: Run deploy script via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.VPS_HOST }}
          port:        ${{ secrets.VPS_PORT }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script_stop: true   # Abort the SSH session on the first failing command.
          script: |
            bash "${{ secrets.VPS_DEPLOY_PATH }}/scripts/deploy.sh"
